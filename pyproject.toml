[project]
name = "nlp-spo-plus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed Rharrassi", email = "m.rharrassi1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "google-genai>=2.33.0",
    "gurobipy>=13.0.3",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "notebook>=7.6.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "peft>=0.21.2",
    "pyepo>=2.2.7",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "transformers[torch]>=5.21.0",
]

[project.scripts]
nlp-spo-plus = "nlp_spo_plus:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
